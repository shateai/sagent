name = "wealth-agent-cron"
main = "src/index.ts"
compatibility_date = "2024-05-02"

# Cron trigger to wake up the agent every 5 minutes
[triggers]
crons = [ "*/5 * * * *" ]

# Environment variables (Wrangler bindings)
[vars]
FIREBASE_PROJECT_ID = "YOUR_FIREBASE_PROJECT_ID"
CRON_SECRET = "YOUR_SHARED_HMAC_CRON_SECRET"

# Production secrets such as GEMINI_API_KEY, DISCORD_WEBHOOK_URL and
# FIREBASE_SERVICE_ACCOUNT_JSON must be installed securely on production via:
# wrangler secret put GEMINI_API_KEY
# wrangler secret put DISCORD_WEBHOOK_URL
# wrangler secret put FIREBASE_SERVICE_ACCOUNT_JSON
